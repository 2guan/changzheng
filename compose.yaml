services:
  changzheng:
    image: changzheng:1.05
    platform: linux/amd64
    build:
      context: .
    env_file:
      - path: .env.local
        required: false
    ports:
      - "${PORT:-4061}:4061"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
